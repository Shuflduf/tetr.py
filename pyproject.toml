[project]
name = "tetr-py"
version = "0.1.0"
description = "Tetris clone... in PYTHON!"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Shuflduf", email = "shuflduf@gmail.com" }]
dependencies = [
  "pygame-ce>=2.5.8",
  "pygbag>=0.9.3",
]

[project.scripts]
tetr-py = "tetr_py:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
